name: Weekly Benchmark Report

on:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Fetch full history for proper diff checking
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest

    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          poetry-${{ runner.os }}-

    - name: Install dependencies
      run: |
        poetry install --with dev,reporting

    - name: Check for API keys
      id: check-keys
      run: |
        if [ -n "${{ secrets.BLABLADOR_API_KEY }}" ]; then
          echo "keys_available=true" >> $GITHUB_OUTPUT
        else
          echo "keys_available=false" >> $GITHUB_OUTPUT
        fi

    - name: Create .env file
      if: steps.check-keys.outputs.keys_available == 'true'
      run: |
        echo "BLABLADOR_API_KEY=${{ secrets.BLABLADOR_API_KEY }}" > .env
        echo "BLABLADOR_API_BASE=${{ secrets.BLABLADOR_API_BASE }}" >> .env

    - name: Check model availability and update status
      if: steps.check-keys.outputs.keys_available == 'true'
      run: |
        # Refresh models_status.yaml: availability, latency, last-checked for every
        # registered model. The weekly report's "which models are available" section
        # is driven by this file.
        poetry run python -c "
        from src.hellmholtz.monitoring import ModelAvailabilityMonitor
        monitor = ModelAvailabilityMonitor()
        monitor.check_all_models_automatically()
        print('Model status updated')
        "

    - name: Run benchmarks on all available chat models
      if: steps.check-keys.outputs.keys_available == 'true'
      run: |
        # Build the model list: models marked available in models_status.yaml,
        # minus non-chat endpoints (embedding / transcription) which cannot serve
        # chat completions and would always fail the benchmark.
        AVAILABLE_MODELS=$(python3 -c "
        import re
        import yaml
        with open('models_status.yaml') as f:
            data = yaml.safe_load(f) or {}
        models = data.get('models', {})
        non_chat = re.compile(r'embed|whisper|audio', re.IGNORECASE)
        names = [
            k for k, v in models.items()
            if isinstance(v, dict) and v.get('available', False) and not non_chat.search(k)
        ]
        print(','.join(f'blablador:{m}' for m in names))
        ")

        if [ -n "$AVAILABLE_MODELS" ]; then
          echo "Running benchmarks for available models: $AVAILABLE_MODELS"
          # 2048-token budget: some models (e.g. blablador:code) spend most of the
          # completion budget on hidden reasoning/thinking output and return an
          # empty visible completion truncated with finish_reason="length" at 512.
          poetry run hellm bench --models "$AVAILABLE_MODELS" --all-prompts --replications 1 --max-tokens 2048
        else
          echo "No available chat models found, skipping benchmarks"
        fi

    - name: Generate comprehensive reports
      if: steps.check-keys.outputs.keys_available == 'true'
      run: |
        mkdir -p reports

        # Pick the freshest result set: prefer the newest non-empty
        # results/benchmark_*.json, fall back to the newest incremental
        # .partial.jsonl (written live by the runner, survives crashes/timeouts).
        python3 - <<'PYEOF'
        import json
        from pathlib import Path

        def newest(pattern):
            files = sorted(Path("results").glob(pattern), key=lambda p: p.stat().st_mtime, reverse=True)
            return files[0] if files else None

        chosen = None
        latest_json = newest("benchmark_*.json")
        if latest_json:
            try:
                if len(json.loads(latest_json.read_text())) >= 1:
                    chosen = latest_json
            except (json.JSONDecodeError, OSError):
                chosen = None

        if chosen is None:
            latest_partial = newest("*.partial.jsonl")
            if latest_partial is None:
                raise SystemExit("No benchmark results found in results/")
            records = [json.loads(line) for line in latest_partial.read_text().splitlines() if line.strip()]
            chosen = latest_json or latest_partial
            latest_json = Path("results/benchmark_from_partial.json")
            latest_json.write_text(json.dumps(records))
            chosen = latest_json

        Path("reports/weekly_benchmark_results.json").write_text(Path(chosen).read_text())
        print(f"Using results file: {chosen} -> reports/weekly_benchmark_results.json")
        PYEOF

        # 1) Availability + per-task performance report (md + html)
        poetry run python scripts/generate_comprehensive_report.py reports/weekly_benchmark_results.json

        # 2) Standard benchmark report (response-level detail)
        poetry run hellm report reports/weekly_benchmark_results.json --format markdown --output reports/weekly_benchmark_report.md
        poetry run hellm report reports/weekly_benchmark_results.json --format html-detailed --output reports/weekly_benchmark_report.html

        # 3) Performance chart
        poetry run hellm chart reports/weekly_benchmark_results.json --output reports/weekly_benchmark_chart.png

    - name: Create fallback reports (no API keys)
      if: steps.check-keys.outputs.keys_available == 'false'
      run: |
        mkdir -p reports
        REPORT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

        # Create a placeholder report when no API keys are available
        cat > reports/weekly_benchmark_report.md << EOF
        # Weekly Benchmark Report

        **Note:** This report was generated without API access. To enable full benchmarking:

        1. Set the following secret in your GitHub repository:
           - \`BLABLADOR_API_KEY\`: Your Blablador API key
           - \`BLABLADOR_API_BASE\`: Blablador API base URL (optional)

        2. The workflow will automatically run weekly benchmarks and update this report.

        ## Last Updated
        ${REPORT_DATE}

        ## Status
        ⏳ Waiting for BLABLADOR API credentials to be configured
        EOF

        # Copy placeholder HTML
        cat > reports/weekly_benchmark_report.html << EOF
        <!DOCTYPE html>
        <html>
        <head>
            <title>Weekly Benchmark Report</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 40px; }
                .note { background: #fff3cd; border: 1px solid #ffeaa7; padding: 20px; border-radius: 5px; }
            </style>
        </head>
        <body>
            <h1>Weekly Benchmark Report</h1>
            <div class="note">
                <h3>Note</h3>
                <p>This report was generated without API access. To enable full benchmarking:</p>
                <ol>
                    <li>Set the following secret in your GitHub repository:
                        <ul>
                            <li><code>BLABLADOR_API_KEY</code>: Your Blablador API key</li>
                            <li><code>BLABLADOR_API_BASE</code>: Blablador API base URL (optional)</li>
                        </ul>
                    </li>
                    <li>The workflow will automatically run weekly benchmarks and update this report.</li>
                </ol>
            </div>
            <p><strong>Last Updated:</strong> ${REPORT_DATE}</p>
            <p><strong>Status:</strong> ⏳ Waiting for BLABLADOR API credentials to be configured</p>
        </body>
        </html>
        EOF

    - name: Check for changes
      id: check-changes
      run: |
        if git diff --quiet reports/ models_status.yaml && \
           [ -z "$(git ls-files --others --exclude-standard reports/)" ]; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.check-changes.outputs.changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add reports/ models_status.yaml
        git commit -m "Update weekly benchmark report and model status

        - Generated on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        - Workflow run: ${{ github.run_id }}
        - Commit: ${{ github.sha }}"
        git push

    - name: Create issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Weekly Benchmark Failed',
            body: `The weekly benchmark workflow failed on ${{ github.ref }}.\n\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n**Error:** The benchmark process encountered an error. Please check the logs for details.`,
            labels: ['bug', 'automated']
          })
