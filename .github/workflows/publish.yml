name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Target repository"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  # ============================================================================
  # CODE QUALITY CHECKS
  # ============================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.checks.outputs.status }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "poetry"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "latest"
          virtualenvs-in-project: true

      - name: Cache Dependencies
        uses: actions/cache@v4
        id: cache
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Dependencies
        run: poetry install --no-interaction

      - name: Linting
        run: |
          poetry run ruff check .
          poetry run ruff format . --check

      - name: Type Checking
        run: poetry run mypy src/

      - name: Security Scan
        run: |
          poetry run bandit -r src/ -ll
          poetry run safety check

      - name: Documentation Validation
        run: poetry run doc8 docs/ || true

      - name: Export Quality Status
        id: checks
        run: echo "status=success" >> $GITHUB_OUTPUT

  # ============================================================================
  # TEST SUITE
  # ============================================================================
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "latest"
          virtualenvs-in-project: true

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python-version }}-poetry-

      - name: Install Dependencies
        run: poetry install --no-interaction

      - name: Execute Test Suite
        run: |
          poetry run pytest \
            tests/ \
            -v \
            --cov=src/hellmholtz \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=50

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}

  # ============================================================================
  # BUILD ARTIFACTS
  # ============================================================================
  build-package:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [quality-gate, test-suite]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "poetry"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "latest"

      - name: Build Distribution
        run: poetry build --no-interaction

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ============================================================================
  # PUBLISH TO PYPI
  # ============================================================================
  publish-pypi:
    name: Publish to PyPI
    if: (github.event_name == 'release' && github.event.action == 'published') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    runs-on: ubuntu-latest
    needs: [quality-gate, test-suite, build-package]
    environment:
      name: pypi
      url: https://pypi.org/project/hellmholtz/
    permissions:
      id-token: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true

  # ============================================================================
  # PUBLISH TO TESTPYPI
  # ============================================================================
  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    needs: [quality-gate, test-suite, build-package]
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hellmholtz/
    permissions:
      id-token: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          print-hash: true

  # ============================================================================
  # CREATE GITHUB RELEASE
  # ============================================================================
  create-release:
    name: Create GitHub Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [quality-gate, test-suite, build-package]
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "poetry"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "latest"
          virtualenvs-in-project: true

      - name: Extract Version
        id: version
        run: |
          version=$(poetry version --short)
          tag_name="v${version}"
          echo "tag_name=${tag_name}" >> $GITHUB_OUTPUT
          echo "Release Version: ${tag_name}"

      - name: Create Git Tag
        id: create-tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = "${{ steps.version.outputs.tag_name }}";
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
              core.info(`Created tag ${tag}`);
            } catch (error) {
              if (error.status === 422) {
                core.info(`Tag ${tag} already exists`);
              } else {
                throw error;
              }
            }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release v${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false

  # ============================================================================
  # UPLOAD RELEASE ARTIFACTS
  # ============================================================================
  upload-release-artifacts:
    name: Upload Release Artifacts
    runs-on: ubuntu-latest
    needs: [quality-gate, test-suite, build-package, create-release]
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Get Version
        id: version
        run: |
          version=$(poetry version --short)
          echo "tag_name=v${version}" >> $GITHUB_OUTPUT

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.version.outputs.tag_name }} dist/* --clobber
