name: Daily Model Availability Check

on:
  schedule:
    # Run daily at 2 AM UTC (night time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  check-models:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest

    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          poetry-${{ runner.os }}-

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Check for API keys
      id: check-keys
      run: |
        if [ -n "${{ secrets.BLABLADOR_API_KEY }}" ] && [ -n "${{ secrets.BLABLADOR_API_BASE }}" ]; then
          echo "keys_available=true" >> $GITHUB_OUTPUT
        else
          echo "keys_available=false" >> $GITHUB_OUTPUT
          if [ -z "${{ secrets.BLABLADOR_API_KEY }}" ]; then
            echo "⚠ BLABLADOR_API_KEY is not set"
          fi
          if [ -z "${{ secrets.BLABLADOR_API_BASE }}" ]; then
            echo "⚠ BLABLADOR_API_BASE is not set"
          fi
        fi

    - name: Create .env file
      if: steps.check-keys.outputs.keys_available == 'true'
      run: |
        echo "BLABLADOR_API_KEY=${{ secrets.BLABLADOR_API_KEY }}" > .env
        echo "BLABLADOR_API_BASE=${{ secrets.BLABLADOR_API_BASE }}" >> .env

    - name: Check model availability
      if: steps.check-keys.outputs.keys_available == 'true'
      run: |
        poetry run hellm monitor --save-report

    - name: Generate availability report
      if: steps.check-keys.outputs.keys_available == 'true'
      run: |
        mkdir -p reports
        poetry run python - << 'SCRIPT_EOF'
import yaml
from datetime import datetime, timezone

with open('models_status.yaml', 'r') as f:
    data = yaml.safe_load(f) or {}

models = data.get('models', data) if isinstance(data, dict) else {}

available = [m for m, v in models.items() if isinstance(v, dict) and v.get('available')]
unavailable = [m for m, v in models.items() if isinstance(v, dict) and not v.get('available')]

now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')

lines = [
    '# Daily Model Availability Report',
    '',
    f'**Generated:** {now}',
    '',
    '## Summary',
    '',
    f'| Metric | Count |',
    f'|--------|-------|',
    f'| Total models | {len(models)} |',
    f'| Available ✅ | {len(available)} |',
    f'| Unavailable ❌ | {len(unavailable)} |',
    f'| Availability rate | {len(available) / len(models) * 100:.1f}% |' if models else '| Availability rate | N/A |',
    '',
    '## Available Models ✅',
    '',
    '| Model | Latency (s) | Tokens | Category |',
    '|-------|-------------|--------|----------|',
]

for m in sorted(available):
    info = models[m]
    latency = info.get('latency') or info.get('latency_ms')
    if isinstance(latency, (int, float)) and latency > 10:
        latency_str = f'{latency / 1000:.3f}'
    elif isinstance(latency, float):
        latency_str = f'{latency:.3f}'
    else:
        latency_str = 'N/A'
    tokens = info.get('tokens', 'N/A')
    tokens_str = f'{int(tokens) // 1024}k' if isinstance(tokens, (int, float)) and tokens >= 1024 else str(tokens)
    category = info.get('category', '')
    lines.append(f'| {m} | {latency_str} | {tokens_str} | {category} |')

lines += [
    '',
    '## Unavailable Models ❌',
    '',
    '| Model | Description |',
    '|-------|-------------|',
]
for m in sorted(unavailable):
    info = models[m]
    desc = info.get('description', '')
    lines.append(f'| {m} | {desc} |')

lines += [
    '',
    '## Raw Status',
    '',
    '```yaml',
    yaml.dump(data, default_flow_style=False).rstrip(),
    '```',
    '',
]

report = '\n'.join(lines)
with open('reports/model_availability_report.md', 'w') as f:
    f.write(report)

print('Availability report generated: reports/model_availability_report.md')
SCRIPT_EOF

    - name: Check for changes
      id: check-changes
      run: |
        if git diff --quiet models_status.yaml reports/model_availability_report.md 2>/dev/null || \
           (! git ls-files --error-unmatch reports/model_availability_report.md 2>/dev/null); then
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.check-changes.outputs.changes == 'true' && steps.check-keys.outputs.keys_available == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add models_status.yaml reports/model_availability_report.md
        git commit -m "Daily model availability check

        - Checked at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        - Workflow run: ${{ github.run_id }}
        - Branch: ${{ github.ref }}"
        git push

    - name: Workflow status notification
      if: always()
      run: |
        if [ "${{ steps.check-keys.outputs.keys_available }}" == "true" ]; then
          echo "✓ Model availability check completed successfully"
        else
          echo "⚠ Skipped: BLABLADOR_API_KEY not configured"
        fi
