name: Daily Model Availability Check

# Deliberately small: sync the model registry with the API and send one tiny request
# (max_tokens=5) per listed model to see which are really up. Benchmarks run in
# weekly-benchmark.yml.

on:
  schedule:
    # Run daily at 2 AM UTC (night time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: daily-model-check
  cancel-in-progress: false

jobs:
  check-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Check for API keys
      id: check-keys
      env:
        BLABLADOR_API_KEY: ${{ secrets.BLABLADOR_API_KEY }}
      run: |
        if [ -n "$BLABLADOR_API_KEY" ]; then
          echo "keys_available=true" >> $GITHUB_OUTPUT
        else
          echo "keys_available=false" >> $GITHUB_OUTPUT
          echo "::warning::BLABLADOR_API_KEY not configured; skipping the check"
        fi

    - name: Checkout repository
      if: steps.check-keys.outputs.keys_available == 'true'
      uses: actions/checkout@v4

    - name: Set up Python
      if: steps.check-keys.outputs.keys_available == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      if: steps.check-keys.outputs.keys_available == 'true'
      uses: snok/install-poetry@v1
      with:
        version: latest

    - name: Cache Poetry dependencies
      if: steps.check-keys.outputs.keys_available == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          poetry-${{ runner.os }}-

    - name: Install dependencies
      if: steps.check-keys.outputs.keys_available == 'true'
      run: poetry install

    - name: Create .env file
      if: steps.check-keys.outputs.keys_available == 'true'
      env:
        BLABLADOR_API_KEY: ${{ secrets.BLABLADOR_API_KEY }}
        BLABLADOR_API_BASE: ${{ secrets.BLABLADOR_API_BASE }}
      run: |
        {
          echo "BLABLADOR_API_KEY=$BLABLADOR_API_KEY"
          # An empty value would override the client's default endpoint.
          if [ -n "$BLABLADOR_API_BASE" ]; then echo "BLABLADOR_API_BASE=$BLABLADOR_API_BASE"; fi
        } > .env

    - name: Sync model registry with the API
      if: steps.check-keys.outputs.keys_available == 'true'
      run: poetry run hellm models sync

    - name: Test which models are up (one 5-token request each)
      if: steps.check-keys.outputs.keys_available == 'true'
      run: |
        # -P keeps the repo root (which holds a test stub of `aisuite`) off sys.path,
        # otherwise the stub shadows the real client and every request fails.
        poetry run python -P -c "
        from hellmholtz.monitoring import ModelAvailabilityMonitor
        ModelAvailabilityMonitor().check_all_models_automatically()
        import yaml
        models = yaml.safe_load(open('models_status.yaml'))['models']
        up = [m for m, v in models.items() if v.get('available')]
        print(f'{len(up)}/{len(models)} models listed by the API')
        "

    - name: Commit and push changes
      if: steps.check-keys.outputs.keys_available == 'true'
      run: |
        git add models_status.yaml src/hellmholtz/providers/models/
        if git diff --cached --quiet; then
          echo "No changes"
          exit 0
        fi
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -m "chore(models): daily registry sync and availability check

        - Checked at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        - Workflow run: ${{ github.run_id }}"
        git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
        git push
