[project]
name = "hellmholtz"
version = "0.6.7"
description = "A comprehensive Python package for unified LLM access, benchmarking, evaluation, and reporting"
authors = [
  { name = "Jonas Heinicke", email = "jonas.heinicke@helmholtz-hzi.de" },
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aisuite>=0.2.0,<0.3",
  "httpx>=0.28.1,<1",
  "jinja2>=3.1.6,<4",
  "openai>=2.54.0,<3",
  "pydantic>=2.13.5,<3",
  "python-dotenv>=1.2.3,<2",
  "pyyaml>=6.0.3,<7",
  "requests>=2.34.2,<3",
  "rich>=13.9.4,<14",
  "tqdm>=4.67.3,<5",
  "typer>=0.27.2,<0.28",
]
license = { text = "MIT" }
keywords = [
  "llm",
  "benchmark",
  "aisuite",
  "openai",
  "anthropic",
  "google",
  "ollama",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/JonasHeinickeBio/HeLLMholtz"
Documentation = "https://github.com/JonasHeinickeBio/HeLLMholtz#readme"
Repository = "https://github.com/JonasHeinickeBio/HeLLMholtz.git"
Issues = "https://github.com/JonasHeinickeBio/HeLLMholtz/issues"
Changelog = "https://github.com/JonasHeinickeBio/HeLLMholtz/releases"

[project.scripts]
hellm-setup = "hellmholtz.cli:main"
hellm = "hellmholtz.cli:main"

[project.optional-dependencies]
eval = ["lm-eval>=0.4.13,<0.5"]
proxy = ["litellm[proxy]>=1.103.2,<2"]
mcp = ["mcp>=2.2.0,<3"]
reporting = [
  "matplotlib>=3.11.1,<4",
  "numpy>=2.5.3,<3",
  "scipy>=1.18.1,<2",
  "seaborn>=0.13.2,<0.14",
]

[tool.poetry]
packages = [{ include = "hellmholtz", from = "src" }]

# Dependency groups are for development only and are not published. They are all
# non-optional, so a plain `poetry install` installs every one of them.

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"

[tool.poetry.group.lint.dependencies]
ruff = "^0.16.6"
pre-commit = "^4.6.2"

[tool.poetry.group.typing.dependencies]
mypy = "^2.3.1"
types-requests = "^2.33.0"
types-PyYAML = "^6.0.12"

[tool.poetry.group.security.dependencies]
bandit = "^1.9.4"

# Mirrors the `reporting` extra so contributors can chart and test reports
# without extras. Keep the constraints in sync with [project.optional-dependencies].
[tool.poetry.group.reporting.dependencies]
matplotlib = "^3.11.1"
numpy = "^2.5.3"
scipy = "^1.18.1"
seaborn = "^0.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
  "slow: mark test as slow (use '-m \"not slow\"' to skip)",
  "integration: mark test as integration (use '-m \"not integration\"' to skip)",
  "unit: mark test as unit (use '-m \"not unit\"' to skip)",
  "network: mark test that requires network access (use '-m \"not network\"' to skip)",
  "functional: mark test as functional (use '-m \"not functional\"' to skip)",
  "model: mark tests that require ML model dependencies (sentence-transformers, rapidfuzz, etc.)",
]

[tool.ruff]
line-length = 99
target-version = "py312"
exclude = [
  ".git",
  ".venv",
  "dist",
  "build",
  "docs",
  "__pycache__",
  ".pytest_cache",
  ".vscode",
  ".github",
  ".idea",
  "examples",
  "tests",
  "scripts",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "C90", # mccabe complexity
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = ["E203", "E266", "E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]         # Allow unused imports in __init__.py
"blablador_config.py" = ["C901"] # Allow high complexity in sync functions

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["hellmholtz"]
force-sort-within-sections = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.coverage.run]
branch = true
source = ["hellmholtz"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50     # Set your desired test coverage threshold

[tool.bandit]
skips = ["B101", "B303", "B404", "B603", "B607"]
exclude_dirs = [
  "tests",
  "docs",
  "examples",
  ".venv",
  "dist",
  "build",
  ".git",
  "__pycache__",
  ".pytest_cache",
  ".vscode",
  ".github",
  ".idea",
]
paths = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = "(tests/|examples/)"
files = "src/"
disable_error_code = ["misc", "import-untyped", "arg-type"]
