repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix, src/]  # auto-fix issues where possible, only check src/
        language_version: python3.12
      - id: ruff-format
        args: [src/]  # only format src/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        language_version: python3.12
        exclude: ^(tests/|examples/)
        args: [--disable-error-code=arg-type]
        # The hook runs in an isolated env: without these, typer/pydantic
        # decorators resolve to Any and mypy 2 reports untyped-decorator.
        # Keep in sync with the runtime constraints in pyproject.toml.
        additional_dependencies:
          - "typer>=0.27.2,<0.28"
          - "pydantic>=2.13.5,<3"
          - types-requests
          - types-PyYAML

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (security linter)
        types: [python]
        pass_filenames: false
        language_version: python3.12
        args: [-c, pyproject.toml, -r, ./src, --exclude, "tests,.venv,.git,.mypy_cache,.pytest_cache"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2000"]  # adjust 2000 to your preferred max size in kilobytes
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-no-eval
      - id: python-no-log-warn

  - repo: local
    hooks:
      - id: poetry-lock
        name: Ensure poetry.lock is up-to-date
        entry: bash -c 'poetry lock && git diff --exit-code poetry.lock'
        language: system
        pass_filenames: false
